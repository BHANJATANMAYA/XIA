# xia Configuration
# All paths are relative to the SSD root — do not use absolute paths here.

# ─────────────────────────────────────────────
# LLM / Model settings
# ─────────────────────────────────────────────
llm:
  provider: ollama
  model: gemma2:9b          # Change to: llama3, phi3, gemma2, etc.
  base_url: http://localhost:11434
  temperature: 0.7
  max_tokens: 4096
  stream: true
  timeout: 300            # Seconds before giving up on a response

# ─────────────────────────────────────────────
# Agent settings
# ─────────────────────────────────────────────
agent:
  name: xia
  max_steps: 10           # Max THINK→ACT iterations per task
  max_retries: 3          # Retries on tool failure
  verbose: true           # Print step-by-step reasoning to CLI

# ─────────────────────────────────────────────
# Memory settings
# ─────────────────────────────────────────────
memory:
  enabled: true
  provider: chromadb
  collection_name: xia_memory
  embedding_model: all-MiniLM-L6-v2   # Runs locally, ~90MB
  max_results: 5                       # How many memories to retrieve per query
  similarity_threshold: 0.40
  working_memory_size: 8               # In-RAM short-term memory window
  cache_ttl_seconds: 300               # Fast-cache TTL for repeated queries
  rerank_candidates: 20                # Vector candidates before re-rank
  relevance_weight: 0.60               # Score mix: relevance + recency + importance
  recency_weight: 0.25
  importance_weight: 0.15
  default_importance: 0.50
  default_memory_type: semantic
  typed_extraction_enabled: true       # Enable typed memory extraction
  graph_enabled: true                  # Enable local memory relationship graph
  graph_max_results: 3                 # Graph hints returned per query

# ─────────────────────────────────────────────
# Skills settings
# ─────────────────────────────────────────────
skills:
  enabled: true
  auto_extract: true      # Automatically extract skills after each session
  max_skills: 500         # Cap on stored skills

# ─────────────────────────────────────────────
# Tools
# ─────────────────────────────────────────────
tools:
  filesystem:
    enabled: true
    allowed_paths:        # Restrict file access to these roots
      - "."               # Relative to SSD root
      - "./workspace"
  terminal:
    enabled: true
    timeout: 600           # Seconds before killing a command
    dangerous_commands:   # These will require user confirmation
      - "rm"
      - "del"
      - "format"
      - "rmdir"
  search:
    enabled: false        # Enable in Part 6 when you add an API key
    provider: serpapi     # Options: serpapi, duckduckgo, tavily
    max_results: 5

# ─────────────────────────────────────────────
# Interface
# ─────────────────────────────────────────────
interface:
  type: cli
  theme: dark
  show_thinking: true     # Show THINK/PLAN/ACT steps in UI
  show_tool_calls: true

# ─────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────
logging:
  level: INFO             # DEBUG, INFO, WARNING, ERROR
  log_to_file: true
  max_log_size_mb: 10
  backup_count: 3
